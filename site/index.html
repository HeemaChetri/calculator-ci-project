<!DOCTYPE html>
<html>
<head>
    <title>Calculator Application</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            width: 300px;
            margin: auto;
            border-radius: 12px;
        }

        input {
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Calculator Application</h1>

    <p>Deployment Automation Using GitHub Actions</p>

    <input type="number" id="num1"
    placeholder="First number">

    <input type="number" id="num2"
    placeholder="Second number">

    <br><br>

    <button onclick="calculate()">Add Numbers</button>

    <h3 id="result">Result:</h3>

    <p>Version 1 - Stable Release</p>

</div>

<script>

function calculate() {

    let a = Number(document.getElementById("num1").value);

    let b = Number(document.getElementById("num2").value);

    let sum = a + b;

    document.getElementById("result").innerHTML =
    "Result: " + sum;

}

</script>

</body>
</html>
